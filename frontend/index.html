<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XR Collab - 实时协作平台</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="scanning.css">
</head>
<body>
    <!-- Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Legacy contract container -->
    <div id="controls">
    
    <!-- Top Navigation Bar -->
    <nav id="top-nav">
        <div class="nav-left">
            <div class="logo">🎮 XR Collab</div>
            <div id="room-badge" style="display: none;">
                <div id="room-info" style="display: none;">
                    <span id="room-info-text"></span>
                </div>
                <button id="copy-invite" class="icon-btn" title="复制邀请">📋</button>
            </div>
        </div>
        
        <div class="nav-center">
            <div id="connection-status" class="status-badge disconnected">
                <span class="status-dot"></span>
                <span id="status-text">未连接</span>
            </div>
            <span id="status" style="display: none;" aria-hidden="true">未连接</span>
        </div>
        
        <div class="nav-right">
            <button id="perf-toggle" class="icon-btn" title="性能监控">📊</button>
            <button id="users-toggle" class="icon-btn" title="在线用户">👥</button>
            <button id="help-toggle" class="icon-btn" title="帮助">?</button>
            <button id="fullscreen-toggle" class="icon-btn" title="全屏">⛶</button>
        </div>
    </nav>

    <!-- Left Primary Sidebar -->
    <aside id="primary-sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>🎨 工具面板</h3>
            <button id="sidebar-collapse" class="icon-btn">◀</button>
        </div>
        
        <div class="sidebar-content">
            <!-- Scan Button - Prominent Position -->
            <button id="scan-btn" class="primary-btn scan-btn" onclick="openMLSharpPanel()" onmousedown="if(window.mlsharpUI){window.mlsharpUI.togglePanel();return false;}">
                🏢 空间扫描
            </button>
            
            <!-- Create Section -->
            <div class="tool-section">
                <h4>📦 创建形状</h4>
                <div class="btn-grid">
                    <button onclick="createCube()" class="tool-btn">🟦 方块</button>
                    <button onclick="createSphere()" class="tool-btn">🔵 球体</button>
                    <button onclick="createCylinder()" class="tool-btn">🔶 圆柱</button>
                    <button onclick="createTorus()" class="tool-btn">🍩 圆环</button>
                </div>
            </div>
            
            <!-- Whiteboard Tools -->
            <div class="tool-section">
                <h4>🖍️ 白板工具</h4>
                <div class="btn-grid">
                    <button class="tool-btn active" onclick="whiteboardSystem.setTool('brush')">🖌️ 画笔</button>
                    <button class="tool-btn" onclick="whiteboardSystem.setTool('text')">🔤 文本</button>
                    <button class="tool-btn" onclick="whiteboardSystem.setTool('eraser')">🧽 橡皮</button>
                    <button onclick="createWhiteboardNearCamera()" class="tool-btn">➕ 创建</button>
                </div>
            </div>
            
            <!-- Color & Material -->
            <div class="tool-section">
                <h4>🎨 颜色/材质</h4>
                <input type="color" id="colorPicker" value="#4CAF50">
                <select id="materialPreset">
                    <option value="standard">标准</option>
                    <option value="metal">金属</option>
                    <option value="matte">哑光</option>
                </select>
            </div>
            
            <!-- File Upload -->
            <div class="tool-section">
                <h4>📎 文件上传</h4>
                <input type="file" id="file-input" style="display:none" accept="image/*,application/pdf">
                <button onclick="document.getElementById('file-input').click()" class="tool-btn">📁 选择文件</button>
                <div id="upload-status"></div>
            </div>
        </div>
    </aside>

    <!-- Right Utility Drawer -->
    <aside id="utility-drawer" class="drawer collapsed">
        <button id="drawer-toggle" class="drawer-toggle">
            <span>◀</span>
        </button>
        
        <div class="drawer-content">
            <div class="drawer-section">
                <h4>🕘 操作历史 <span id="history-count">0 / 100</span></h4>
                <div id="history-controls">
                    <button id="undo-btn" onclick="requestUndo()">↩️ 撤销</button>
                    <button id="redo-btn" onclick="requestRedo()">↪️ 重做</button>
                </div>
                <ul id="operation-history-list"></ul>
                <div id="worker-result" style="display: none;"></div>
            </div>
            
            <div class="drawer-section">
                <h4>👥 在线用户</h4>
                <ul id="users-list"></ul>
            </div>
        </div>
    </aside>

    <!-- Mobile Bottom Nav -->
    <nav id="bottom-nav" class="mobile-only">
        <button class="bottom-nav-btn" onclick="toggleSidebar()">
            <span>🎨</span>
            <span>工具</span>
        </button>
        <button class="bottom-nav-btn" id="mobile-scan-btn" onclick="openMLSharpPanel()" onmousedown="if(window.mlsharpUI){window.mlsharpUI.togglePanel();return false;}">
            <span>🏢</span>
            <span>扫描</span>
        </button>
        <button class="bottom-nav-btn" onclick="createWhiteboardNearCamera()">
            <span>📝</span>
            <span>白板</span>
        </button>
        <button id="chat-open-btn" class="bottom-nav-btn" onclick="toggleChat()">
            <span>💬</span>
            <span>聊天</span>
        </button>
    </nav>

    </div>

    <!-- Join Panel (Modal) -->
    <div id="join-panel" class="modal-overlay">
        <div class="modal-content">
            <h2>🎮 加入房间</h2>
            
            <label>昵称</label>
            <input type="text" id="username" placeholder="输入你的名字" value="用户">
            
            <div class="section">
                <h3>创建房间</h3>
                <input type="text" id="createRoomName" placeholder="房间名称">
                <label><input type="checkbox" id="createRoomPublic" checked> 公开房间</label>
                <input type="password" id="createRoomPassword" placeholder="密码（可选）">
                <button onclick="createRoom()" class="primary-btn">创建并进入</button>
            </div>
            
            <div class="section">
                <h3>加入房间</h3>
                <input type="text" id="roomId" placeholder="房间ID">
                <input type="password" id="joinRoomPassword" placeholder="密码（如有）">
                <button onclick="joinRoom()" class="primary-btn">加入</button>
            </div>
            
            <div class="section">
                <h3>公开房间</h3>
                <button onclick="refreshRoomList()" class="secondary-btn">刷新列表</button>
                <ul id="public-room-list"></ul>
            </div>
            
            <div id="join-error"></div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div id="chat-panel" class="panel">
        <div class="panel-header">
            <span>💬 聊天</span>
            <button id="chat-toggle">✕</button>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-row">
            <input id="chat-input" type="text" placeholder="输入消息..." maxlength="200">
            <button id="chat-send">发送</button>
        </div>
    </div>

    <!-- Help Panel -->
    <div id="help-panel" class="panel" style="display: none;">
        <div class="panel-header">
            <span>💡 操作提示</span>
            <button onclick="toggleHelp()">✕</button>
        </div>
        <div class="help-content">
            <h4>基本操作</h4>
            <p><kbd>WASD</kbd> 移动 | <kbd>鼠标</kbd> 视角</p>
            <p><kbd>1-5</kbd> 创建形状 | <kbd>Del</kbd> 删除</p>
            <p><kbd>Ctrl+Z</kbd> 撤销 | <kbd>Ctrl+Shift+Z</kbd> 重做</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
        }
    }
    </script>
    <script src="lib/fullscreen.js"></script>
    <script src="lib/interactive-feedback.js"></script>
    <script src="lib/file-upload.js"></script>
    <script type="module" src="scanning-ui.js"></script>
    <script type="module" src="mlsharp-ui.js"></script>
    <script type="module" src="app.js"></script>
    <script>
        // UI Toggle Functions
        function toggleSidebar() {
            document.getElementById('primary-sidebar').classList.toggle('collapsed');
        }
        
        function openMLSharpPanel() {
            if (window.mlsharpUI) {
                window.mlsharpUI.togglePanel();
            } else {
                console.log('ML_Sharp UI not initialized yet');
                // 延迟重试
                setTimeout(() => {
                    if (window.mlsharpUI) {
                        window.mlsharpUI.togglePanel();
                    } else {
                        alert('扫描功能正在加载中，请稍后再试');
                    }
                }, 1000);
            }
        }
        
        function createRoom() {
            const roomName = document.getElementById('createRoomName').value || 'Room-' + Math.random().toString(36).substr(2, 6);
            const isPublic = document.getElementById('createRoomPublic').checked;
            const password = document.getElementById('createRoomPassword').value;
            
            // 构建URL参数
            let url = `?room=${roomName}`;
            if (!isPublic && password) {
                url += `&password=${encodeURIComponent(password)}`;
            }
            
            // 跳转到房间
            window.location.href = url;
        }
        
        function toggleChat() {
            const panel = document.getElementById('chat-panel');
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        }
        
        function toggleHelp() {
            const panel = document.getElementById('help-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }
        
        // Drawer Toggle
        document.getElementById('drawer-toggle').addEventListener('click', () => {
            document.getElementById('utility-drawer').classList.toggle('collapsed');
        });
        
        // Sidebar Collapse
        document.getElementById('sidebar-collapse').addEventListener('click', () => {
            document.getElementById('primary-sidebar').classList.toggle('collapsed');
        });
    </script>
</body>
</html>
